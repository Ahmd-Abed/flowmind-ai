<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowMind Workspace Chat</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --panel: #ffffff;
        --panel-soft: #f9faf7;
        --text: #18201d;
        --muted: #66716c;
        --line: #dfe5df;
        --brand: #18735c;
        --brand-dark: #105944;
        --mine: #d9fdd3;
        --theirs: #ffffff;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text);
        background:
          linear-gradient(180deg, #0f6b55 0 128px, transparent 128px),
          var(--bg);
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app {
        width: min(1180px, calc(100vw - 32px));
        height: min(780px, calc(100vh - 32px));
        margin: 16px auto;
        display: grid;
        grid-template-columns: 340px 1fr;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: var(--panel);
        box-shadow: 0 20px 70px rgba(10, 30, 20, 0.18);
        overflow: hidden;
      }

      .sidebar {
        min-width: 0;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--panel-soft);
      }

      .brand,
      .chat-header {
        height: 68px;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: #eef3ef;
      }

      .brand-title,
      .chat-title {
        min-width: 0;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
        font-weight: 760;
      }

      h2 {
        font-size: 16px;
        font-weight: 720;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sub {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .login {
        padding: 18px;
        display: grid;
        gap: 12px;
        border-bottom: 1px solid var(--line);
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label {
        font-size: 12px;
        font-weight: 700;
        color: #3b4641;
      }

      input {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
        background: #fff;
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(24, 115, 92, 0.15);
      }

      .primary {
        height: 42px;
        border-radius: 6px;
        background: var(--brand);
        color: white;
        font-weight: 760;
      }

      .primary:hover {
        background: var(--brand-dark);
      }

      .ghost {
        height: 34px;
        padding: 0 10px;
        border-radius: 6px;
        background: transparent;
        color: var(--brand);
        font-weight: 700;
      }

      .status {
        padding: 9px 18px;
        font-size: 12px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        min-height: 36px;
      }

      .status.error {
        color: var(--danger);
      }

      .workspaces {
        overflow: auto;
      }

      .workspace {
        width: 100%;
        min-height: 64px;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: transparent;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      .workspace:hover,
      .workspace.active {
        background: #e8f1ed;
      }

      .avatar {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #d6e9e1;
        color: #0f5d48;
        font-weight: 800;
      }

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(rgba(246, 244, 239, 0.9), rgba(246, 244, 239, 0.9)),
          radial-gradient(circle at 20px 20px, #d8d2c2 1px, transparent 1px);
        background-size: auto, 34px 34px;
      }

      .connection {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 5px 9px;
        background: #fff;
        color: var(--muted);
        font-size: 12px;
        border: 1px solid var(--line);
      }

      .connection.on {
        color: var(--brand);
      }

      .messages {
        flex: 1;
        min-height: 0;
        padding: 18px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .presence {
        min-height: 43px;
        padding: 8px 18px;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        border-bottom: 1px solid rgba(223, 229, 223, 0.75);
        background: rgba(255, 255, 255, 0.58);
      }

      .presence-chip {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 180px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--text);
        font-size: 12px;
        font-weight: 650;
      }

      .presence-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #19a463;
      }

      .presence-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .typing {
        min-height: 24px;
        padding: 0 18px 6px;
        color: var(--brand);
        font-size: 12px;
        font-weight: 650;
      }

      .empty {
        margin: auto;
        width: min(360px, 100%);
        text-align: center;
        color: var(--muted);
        line-height: 1.45;
      }

      .bubble {
        max-width: min(620px, 76%);
        padding: 8px 10px 6px;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.06);
        background: var(--theirs);
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
        align-self: flex-start;
      }

      .bubble.mine {
        align-self: flex-end;
        background: var(--mine);
      }

      .sender {
        margin-bottom: 3px;
        font-size: 12px;
        font-weight: 760;
        color: var(--brand);
      }

      .content {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.35;
      }

      .time {
        margin-top: 4px;
        text-align: right;
        color: var(--muted);
        font-size: 11px;
      }

      .composer {
        min-height: 68px;
        padding: 12px 14px;
        display: grid;
        grid-template-columns: 1fr 46px;
        gap: 10px;
        border-top: 1px solid var(--line);
        background: #eef3ef;
      }

      .send {
        width: 46px;
        height: 42px;
        border-radius: 50%;
        background: var(--brand);
        color: white;
        font-size: 18px;
        font-weight: 800;
      }

      .send:disabled,
      .primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 760px) {
        .app {
          width: 100vw;
          height: 100vh;
          margin: 0;
          grid-template-columns: 1fr;
        }

        .sidebar.chat-open {
          display: none;
        }

        .main {
          display: none;
        }

        .main.chat-open {
          display: flex;
        }

        .back {
          display: inline-block;
        }
      }

      @media (min-width: 761px) {
        .back {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <div class="brand-title">
            <h1>FlowMind Chat</h1>
            <p id="userLabel" class="sub">Not signed in</p>
          </div>
          <button id="logoutBtn" class="ghost hidden" type="button">Logout</button>
        </div>

        <form id="loginForm" class="login">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button id="loginBtn" class="primary" type="submit">Login</button>
        </form>

        <div id="status" class="status">Login to load your workspaces.</div>
        <div id="workspaceList" class="workspaces"></div>
      </aside>

      <main id="main" class="main">
        <div class="chat-header">
          <button id="backBtn" class="ghost back" type="button">Back</button>
          <div class="chat-title">
            <h2 id="workspaceTitle">Select a workspace</h2>
            <p id="workspaceMeta" class="sub">Messages will appear here.</p>
          </div>
          <div id="socketStatus" class="connection">offline</div>
        </div>

        <div id="presence" class="presence hidden"></div>

        <div id="messages" class="messages">
          <p class="empty">Choose a workspace to load conversation history.</p>
        </div>

        <div id="typingIndicator" class="typing"></div>

        <form id="composer" class="composer">
          <input
            id="messageInput"
            type="text"
            placeholder="Message"
            autocomplete="off"
            disabled
          />
          <button id="sendBtn" class="send" type="submit" disabled title="Send">
            &gt;
          </button>
        </form>
      </main>
    </div>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script>
      const API_URL = "http://localhost:5000";

      const state = {
        token: localStorage.getItem("flowmind_token"),
        user: JSON.parse(localStorage.getItem("flowmind_user") || "null"),
        socket: null,
        workspace: null,
        messages: [],
        onlineUsers: [],
        typingUsers: new Map(),
        typingTimer: null,
        isTyping: false,
      };

      const els = {
        loginForm: document.getElementById("loginForm"),
        loginBtn: document.getElementById("loginBtn"),
        logoutBtn: document.getElementById("logoutBtn"),
        email: document.getElementById("email"),
        password: document.getElementById("password"),
        status: document.getElementById("status"),
        userLabel: document.getElementById("userLabel"),
        workspaceList: document.getElementById("workspaceList"),
        sidebar: document.getElementById("sidebar"),
        main: document.getElementById("main"),
        backBtn: document.getElementById("backBtn"),
        workspaceTitle: document.getElementById("workspaceTitle"),
        workspaceMeta: document.getElementById("workspaceMeta"),
        socketStatus: document.getElementById("socketStatus"),
        messages: document.getElementById("messages"),
        presence: document.getElementById("presence"),
        typingIndicator: document.getElementById("typingIndicator"),
        composer: document.getElementById("composer"),
        messageInput: document.getElementById("messageInput"),
        sendBtn: document.getElementById("sendBtn"),
      };

      const setStatus = (message, isError = false) => {
        els.status.textContent = message;
        els.status.classList.toggle("error", isError);
      };

      const api = async (path, options = {}) => {
        const response = await fetch(`${API_URL}${path}`, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
            ...(options.headers || {}),
          },
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || `Request failed: ${response.status}`);
        }

        return data;
      };

      const formatTime = (value) => {
        if (!value) return "";
        return new Intl.DateTimeFormat(undefined, {
          hour: "2-digit",
          minute: "2-digit",
        }).format(new Date(value));
      };

      const getSenderId = (message) => {
        if (!message.sender) return "";
        return typeof message.sender === "string"
          ? message.sender
          : message.sender._id || message.sender.id || "";
      };

      const getSenderName = (message) => {
        if (!message.sender) return "Unknown";
        return typeof message.sender === "string"
          ? message.sender
          : message.sender.name || message.sender.email || "Unknown";
      };

      const getUserName = (user) => user?.name || user?.email || "Unknown";

      const renderPresence = () => {
        els.presence.innerHTML = "";

        if (!state.workspace) {
          els.presence.classList.add("hidden");
          return;
        }

        els.presence.classList.remove("hidden");

        if (!state.onlineUsers.length) {
          els.presence.innerHTML =
            '<span class="sub">No connected users in this chat.</span>';
          return;
        }

        const fragment = document.createDocumentFragment();

        for (const user of state.onlineUsers) {
          const chip = document.createElement("div");
          const name =
            user.id === state.user?.id ? `${getUserName(user)} (you)` : getUserName(user);

          chip.className = "presence-chip";
          chip.innerHTML = `
            <span class="presence-dot"></span>
            <span class="presence-name"></span>
          `;
          chip.querySelector(".presence-name").textContent = name;
          fragment.appendChild(chip);
        }

        els.presence.appendChild(fragment);
      };

      const renderTyping = () => {
        const names = Array.from(state.typingUsers.values()).map(getUserName);

        if (!names.length) {
          els.typingIndicator.textContent = "";
          return;
        }

        if (names.length === 1) {
          els.typingIndicator.textContent = `${names[0]} is typing...`;
          return;
        }

        if (names.length === 2) {
          els.typingIndicator.textContent = `${names[0]} and ${names[1]} are typing...`;
          return;
        }

        els.typingIndicator.textContent = `${names.length} people are typing...`;
      };

      const clearTyping = () => {
        state.typingUsers.clear();
        state.isTyping = false;

        if (state.typingTimer) {
          clearTimeout(state.typingTimer);
          state.typingTimer = null;
        }

        renderTyping();
      };

      const emitTypingStop = () => {
        if (!state.workspace || !state.socket?.connected || !state.isTyping) {
          return;
        }

        state.socket.emit("typing_stop", {
          workspaceId: state.workspace._id,
        });
        state.isTyping = false;
      };

      const renderMessages = () => {
        els.messages.innerHTML = "";

        if (!state.messages.length) {
          els.messages.innerHTML =
            '<p class="empty">No messages yet. Send the first one.</p>';
          return;
        }

        const fragment = document.createDocumentFragment();

        for (const message of state.messages) {
          const bubble = document.createElement("article");
          const isMine = getSenderId(message) === state.user?.id;

          bubble.className = `bubble${isMine ? " mine" : ""}`;
          bubble.innerHTML = `
            <div class="sender">${isMine ? "You" : getSenderName(message)}</div>
            <div class="content"></div>
            <div class="time">${formatTime(message.createdAt)}</div>
          `;
          bubble.querySelector(".content").textContent = message.content || "";
          fragment.appendChild(bubble);
        }

        els.messages.appendChild(fragment);
        els.messages.scrollTop = els.messages.scrollHeight;
      };

      const renderWorkspaces = (workspaces) => {
        els.workspaceList.innerHTML = "";

        if (!workspaces.length) {
          els.workspaceList.innerHTML =
            '<p class="empty">No workspaces available for this user.</p>';
          return;
        }

        for (const workspace of workspaces) {
          const button = document.createElement("button");
          const members = Array.isArray(workspace.members)
            ? workspace.members.length
            : 0;

          button.type = "button";
          button.className = "workspace";
          button.dataset.workspaceId = workspace._id;
          button.innerHTML = `
            <div class="avatar">${(workspace.name || "W").slice(0, 1).toUpperCase()}</div>
            <div class="brand-title">
              <h2>${workspace.name || "Workspace"}</h2>
              <p class="sub">${members} member${members === 1 ? "" : "s"}</p>
            </div>
          `;
          button.addEventListener("click", () => openWorkspace(workspace));
          els.workspaceList.appendChild(button);
        }
      };

      const setLoggedInUi = () => {
        const isLoggedIn = Boolean(state.token && state.user);

        els.loginForm.classList.toggle("hidden", isLoggedIn);
        els.logoutBtn.classList.toggle("hidden", !isLoggedIn);
        els.userLabel.textContent = isLoggedIn
          ? `${state.user.name || state.user.email}`
          : "Not signed in";
      };

      const connectSocket = () => {
        if (state.socket) {
          state.socket.disconnect();
        }

        state.socket = io(API_URL, {
          auth: { token: state.token },
          transports: ["websocket"],
        });

        state.socket.on("connect", () => {
          els.socketStatus.textContent = "online";
          els.socketStatus.classList.add("on");

          if (state.workspace) {
            state.socket.emit("join_workspace", state.workspace._id);
          }
        });

        state.socket.on("disconnect", () => {
          els.socketStatus.textContent = "offline";
          els.socketStatus.classList.remove("on");
        });

        state.socket.on("connect_error", (error) => {
          els.socketStatus.textContent = "auth error";
          els.socketStatus.classList.remove("on");
          setStatus(error.message, true);
        });

        state.socket.on("receive_message", (message) => {
          if (!state.workspace || message.workspace !== state.workspace._id) {
            return;
          }

          state.typingUsers.delete(getSenderId(message));
          state.messages.push(message);
          renderMessages();
          renderTyping();
        });

        state.socket.on("workspace_presence", (payload) => {
          if (!state.workspace || payload.workspaceId !== state.workspace._id) {
            return;
          }

          state.onlineUsers = payload.users || [];
          renderPresence();
        });

        state.socket.on("user_typing", (payload) => {
          if (
            !state.workspace ||
            payload.workspaceId !== state.workspace._id ||
            payload.user?.id === state.user?.id
          ) {
            return;
          }

          if (payload.isTyping) {
            state.typingUsers.set(payload.user.id, payload.user);
          } else {
            state.typingUsers.delete(payload.user.id);
          }

          renderTyping();
        });

        state.socket.on("error_message", (message) => {
          setStatus(message, true);
        });
      };

      const loadWorkspaces = async () => {
        setStatus("Loading workspaces...");
        const data = await api("/api/workspaces");
        renderWorkspaces(data.workspaces || []);
        setStatus("Select a workspace.");
      };

      const openWorkspace = async (workspace) => {
        if (state.workspace?._id && state.socket?.connected) {
          emitTypingStop();
          state.socket.emit("leave_workspace", state.workspace._id);
        }

        state.workspace = workspace;
        state.onlineUsers = [];
        clearTyping();
        renderPresence();

        document.querySelectorAll(".workspace").forEach((item) => {
          item.classList.toggle("active", item.dataset.workspaceId === workspace._id);
        });

        els.workspaceTitle.textContent = workspace.name || "Workspace";
        els.workspaceMeta.textContent = "Loading message history...";
        els.messageInput.disabled = true;
        els.sendBtn.disabled = true;
        els.sidebar.classList.add("chat-open");
        els.main.classList.add("chat-open");

        if (state.socket?.connected) {
          state.socket.emit("join_workspace", workspace._id, (response) => {
            if (!response?.ok) {
              setStatus(response?.message || "Could not join workspace", true);
              return;
            }

            state.onlineUsers = response.users || [];
            renderPresence();
          });
        }

        const data = await api(`/api/workspaces/${workspace._id}/messages`);
        state.messages = data.messages || [];
        renderMessages();

        els.workspaceMeta.textContent = `${state.messages.length} message${state.messages.length === 1 ? "" : "s"}`;
        els.messageInput.disabled = false;
        els.sendBtn.disabled = false;
        els.messageInput.focus();
      };

      els.loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        els.loginBtn.disabled = true;
        setStatus("Signing in...");

        try {
          const data = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({
              email: els.email.value.trim(),
              password: els.password.value,
            }),
          });

          state.token = data.accessToken;
          state.user = data.user;
          localStorage.setItem("flowmind_token", state.token);
          localStorage.setItem("flowmind_user", JSON.stringify(state.user));

          setLoggedInUi();
          connectSocket();
          await loadWorkspaces();
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          els.loginBtn.disabled = false;
        }
      });

      els.logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("flowmind_token");
        localStorage.removeItem("flowmind_user");
        state.token = null;
        state.user = null;
        state.workspace = null;
        state.messages = [];
        state.onlineUsers = [];
        clearTyping();

        if (state.socket) {
          state.socket.disconnect();
        }

        els.workspaceList.innerHTML = "";
        els.workspaceTitle.textContent = "Select a workspace";
        els.workspaceMeta.textContent = "Messages will appear here.";
        els.presence.innerHTML = "";
        els.presence.classList.add("hidden");
        els.messages.innerHTML =
          '<p class="empty">Choose a workspace to load conversation history.</p>';
        els.messageInput.disabled = true;
        els.sendBtn.disabled = true;
        setLoggedInUi();
        setStatus("Login to load your workspaces.");
      });

      els.composer.addEventListener("submit", (event) => {
        event.preventDefault();

        const content = els.messageInput.value.trim();
        if (!content || !state.workspace || !state.socket?.connected) {
          return;
        }

        emitTypingStop();
        els.messageInput.value = "";
        state.socket.emit(
          "send_message",
          {
            workspaceId: state.workspace._id,
            content,
          },
          (response) => {
            if (!response?.ok) {
              setStatus(response?.message || "Message failed", true);
            }
          },
        );
      });

      els.messageInput.addEventListener("input", () => {
        if (!state.workspace || !state.socket?.connected) {
          return;
        }

        if (els.messageInput.value.trim()) {
          if (!state.isTyping) {
            state.socket.emit("typing_start", {
              workspaceId: state.workspace._id,
            });
            state.isTyping = true;
          }

          if (state.typingTimer) {
            clearTimeout(state.typingTimer);
          }

          state.typingTimer = setTimeout(emitTypingStop, 1500);
        } else {
          emitTypingStop();
        }
      });

      els.backBtn.addEventListener("click", () => {
        els.sidebar.classList.remove("chat-open");
        els.main.classList.remove("chat-open");
      });

      setLoggedInUi();

      if (state.token && state.user) {
        connectSocket();
        loadWorkspaces().catch((error) => {
          setStatus(error.message, true);
        });
      }
    </script>
  </body>
</html>
